apiVersion: ai.sap.com/v1alpha1
kind: ServingTemplate
metadata:
  name: ollama-tinyllama
  annotations:
    scenarios.ai.sap.com/description: "Run Ollama TinyLlama on AI Core Free Tier"
    scenarios.ai.sap.com/name: "ollama-tinyllama"
    executables.ai.sap.com/description: "Ollama TinyLlama serving"
    executables.ai.sap.com/name: "ollama-tinyllama"
  labels:
    scenarios.ai.sap.com/id: "ollama-tinyllama"
    ai.sap.com/version: "0.0.1"
spec:
  template:
    apiVersion: "serving.kserve.io/v1beta1"
    metadata:
      annotations: |
        autoscaling.knative.dev/metric: concurrency
        autoscaling.knative.dev/target: 1
        autoscaling.knative.dev/targetBurstCapacity: 0
      labels: |
        ai.sap.com/resourcePlan: starter
    spec: |
      predictor:
        imagePullSecrets:
          - name: docker-registry-secret
        minReplicas: 1
        maxReplicas: 1
        containers:
          - name: kserve-container
            image: docker.io/pbcsunil/ollama-aicore:latest
            ports:
              - containerPort: 8080
                protocol: TCP
            resources:
              requests:
                memory: "2Gi"
                cpu: "0.5"
              limits:
                memory: "3Gi"
                cpu: "1"
